<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>H TAXI · Acceso privado</title>
    <style>
        :root {
            font-family: Montserrat, "Segoe UI", sans-serif;
            color: #13262e;
            background: #edf1f2
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px
        }

        .card {
            width: min(440px, 100%);
            background: white;
            border: 1px solid #d3dcdf;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 12px 36px #0c2a3618
        }

        .brand {
            font-weight: 700;
            letter-spacing: .18em;
            color: #0b4a5e;
            font-size: 22px
        }

        .sub {
            color: #58707a;
            margin: 4px 0 24px
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin: 14px 0 5px
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #cbd6da;
            border-radius: 7px;
            font: inherit
        }

        button {
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            border: 1px solid #0b4a5e;
            border-radius: 7px;
            background: #0b4a5e;
            color: white;
            font: inherit;
            font-weight: 700;
            cursor: pointer
        }

        .secondary {
            background: white;
            color: #0b4a5e
        }

        #message {
            min-height: 1.5em;
            color: #a1241c;
            font-size: 13px
        }

        small {
            color: #58707a
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="brand">H TAXI</div>
        <p class="sub">Gestión privada de facturas</p>
        <form id="authForm"><label for="email">Correo electrónico</label><input id="email" type="email"
                autocomplete="email" placeholder="Introduce el correo" required><label
                for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password"
                placeholder="Introduce la contraseña" minlength="6" required><button id="submitBtn"
                type="submit">Iniciar sesión</button><button id="toggleBtn" class="secondary" type="button">Crear una
                cuenta</button>
            <p id="message" role="alert"></p>
        </form><small>Cada cuenta solo puede consultar sus propios datos.</small>
    </main>
    <script type="module">
        import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
        import {getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
        const config = {apiKey: "AIzaSyAE0jCIQxn6WstfB4laaOWuoDNkNKWJouE", authDomain: "facturas-hector.firebaseapp.com", projectId: "facturas-hector", storageBucket: "facturas-hector.firebasestorage.app", messagingSenderId: "912775387870", appId: "1:912775387870:web:fb7b3c228a84dd6c12004f"};
        const auth = getAuth(initializeApp(config)); const form = document.getElementById('authForm'), msg = document.getElementById('message'), submit = document.getElementById('submitBtn'), toggle = document.getElementById('toggleBtn'); let creating = false;
        onAuthStateChanged(auth, u => {if (u) location.replace('generador_facturas_h_taxi.html')});
        toggle.onclick = () => {creating = !creating; submit.textContent = creating ? 'Crear cuenta' : 'Iniciar sesión'; toggle.textContent = creating ? 'Ya tengo cuenta' : 'Crear una cuenta'; msg.textContent = ''; document.getElementById('password').autocomplete = creating ? 'new-password' : 'current-password'};
        form.onsubmit = async e => {e.preventDefault(); msg.textContent = ''; submit.disabled = true; try {const email = document.getElementById('email').value.trim(), password = document.getElementById('password').value; if (creating) await createUserWithEmailAndPassword(auth, email, password); else await signInWithEmailAndPassword(auth, email, password); location.replace('generador_facturas_h_taxi.html')} catch (err) {msg.textContent = err.code === 'auth/email-already-in-use' ? 'Ese correo ya tiene una cuenta.' : err.code === 'auth/invalid-credential' ? 'Correo o contraseña incorrectos.' : err.code === 'auth/weak-password' ? 'La contraseña debe tener al menos 6 caracteres.' : err.message} finally {submit.disabled = false} };
    </script>
</body>

</html>
