<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>FACTURAS · Acceso privado</title>
    <style>
        :root {
            font-family: Montserrat, "Segoe UI", sans-serif;
            color: #e5eef1;
            background: #0e181d;
            color-scheme: dark
        }

        * {
            box-sizing: border-box
        }

        [hidden] { display: none !important }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100svh;
            display: grid;
            place-items: center;
            padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
            background: radial-gradient(ellipse at 50% 0%, #1c3540 0%, #0e181d 68%)
        }

        .card {
            width: min(440px, 100%);
            max-height: calc(100svh - 24px);
            overflow-y: auto;
            background: #15232a;
            border: 1px solid #28414b;
            border-radius: 16px;
            padding: clamp(20px, 6vw, 30px);
            box-shadow: 0 18px 48px #0005
        }

        .brand {
            font-weight: 700;
            letter-spacing: .18em;
            color: #5db5cf;
            font-size: 22px
        }

        .sub {
            color: #93a9b1;
            margin: 4px 0 24px
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin: 14px 0 5px
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #28414b;
            border-radius: 7px;
            background: #0e181d;
            color: #e5eef1;
            font: inherit
        }

        button {
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            border: 1px solid #5db5cf;
            border-radius: 7px;
            background: #5db5cf;
            color: #06161c;
            font: inherit;
            font-weight: 700;
            cursor: pointer
        }

        .secondary {
            background: #0e181d;
            color: #5db5cf
        }

        input:focus-visible, button:focus-visible {
            outline: 2px solid #5db5cf;
            outline-offset: 2px
        }

        input::placeholder { color: #789099 }
        button:hover { filter: brightness(1.08) }
        button:disabled { opacity: .6; cursor: wait }
        .password-field { position: relative }
        .password-field input { padding-right: 54px }
        #password::-ms-reveal { display: none }
        .password-toggle svg[hidden] { display: none !important }
        .password-toggle { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); width: 42px; height: 42px; margin: 0; padding: 9px; border: 0; border-radius: 6px; background: transparent; color: #93a9b1; display: grid; place-items: center }
        .password-toggle:hover { color: #5db5cf; background: #15232a; filter: none }
        .password-toggle svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
        @media (max-width: 380px) { .brand { font-size: 20px } .card { border-radius: 12px } }

        #message {
            min-height: 1.5em;
            color: #f2b8b5;
            font-size: 13px
        }

        small {
            color: #93a9b1
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="brand">FACTURAS</div>
        <p class="sub">Gestión privada de facturas</p>
        <form id="authForm"><label for="email">Correo electrónico</label><input id="email" type="email"
                autocomplete="email" placeholder="Introduce el correo" required><label
                for="password">Contraseña</label><div class="password-field"><input id="password" type="password" autocomplete="current-password"
                placeholder="Introduce la contraseña" minlength="6" required><button id="togglePassword" class="password-toggle" type="button" aria-label="Mostrar contraseña" title="Mostrar contraseña"><svg id="eyeOpen" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><svg id="eyeClosed" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.6 10.6 0 0 1 12 5c6.4 0 10 7 10 7a15 15 0 0 1-3.2 4.1M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10 10 0 0 0 4-.8"/></svg></button></div><button id="submitBtn"
                type="submit">Iniciar sesión</button><button id="forgotBtn" class="secondary" type="button">He olvidado mi contraseña</button><button id="toggleBtn" class="secondary" type="button">Crear una
                cuenta</button>
            <p id="message" role="alert"></p>
        </form><small>¡Hola! Bienvenido, cada cuenta solo puede consultar sus propios datos. Edita tus datos tu logo antes de empezar. Gracias</small>
    </main>
    <script type="module">
        import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
        import {getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
        const config = {apiKey: "AIzaSyAE0jCIQxn6WstfB4laaOWuoDNkWNkJouE", authDomain: "facturas-hector.firebaseapp.com", projectId: "facturas-hector", storageBucket: "facturas-hector.firebasestorage.app", messagingSenderId: "912775387870", appId: "1:912775387870:web:fb7b3c228a84dd6c12004f"};
        const auth = getAuth(initializeApp(config)); const passwordInput = document.getElementById('password'); const togglePassword = document.getElementById('togglePassword'); const eyeOpen = document.getElementById('eyeOpen'); const eyeClosed = document.getElementById('eyeClosed'); togglePassword.onclick = () => { const visible = passwordInput.type === 'password'; passwordInput.type = visible ? 'text' : 'password'; togglePassword.setAttribute('aria-label', visible ? 'Ocultar contraseña' : 'Mostrar contraseña'); togglePassword.title = visible ? 'Ocultar contraseña' : 'Mostrar contraseña'; eyeOpen.hidden = visible; eyeClosed.hidden = !visible; }; const forgot = document.getElementById('forgotBtn'); const form = document.getElementById('authForm'), msg = document.getElementById('message'), submit = document.getElementById('submitBtn'), toggle = document.getElementById('toggleBtn'); let creating = false;
        onAuthStateChanged(auth, u => {if (u) location.replace('generador_facturas_h_taxi.html')});
        forgot.onclick = async () => { const email = document.getElementById('email').value.trim(); if (!email) { msg.textContent = 'Escribe primero tu correo electrónico.'; document.getElementById('email').focus(); return; } msg.style.color = '#1b6b45'; msg.textContent = ''; forgot.disabled = true; try { await sendPasswordResetEmail(auth, email); msg.textContent = 'Si existe una cuenta con ese correo, recibirás un enlace para restablecer la contraseña.'; } catch (err) { msg.style.color = '#a1241c'; msg.textContent = err.code === 'auth/invalid-email' ? 'El correo no tiene un formato válido.' : err.message; } finally { forgot.disabled = false; } };
        toggle.onclick = () => {creating = !creating; forgot.hidden = creating; submit.textContent = creating ? 'Crear cuenta' : 'Iniciar sesión'; toggle.textContent = creating ? 'Ya tengo cuenta' : 'Crear una cuenta'; msg.textContent = ''; document.getElementById('password').autocomplete = creating ? 'new-password' : 'current-password'};
        form.onsubmit = async e => {e.preventDefault(); msg.textContent = ''; submit.disabled = true; try {const email = document.getElementById('email').value.trim(), password = document.getElementById('password').value; if (creating) await createUserWithEmailAndPassword(auth, email, password); else await signInWithEmailAndPassword(auth, email, password); location.replace('generador_facturas_h_taxi.html')} catch (err) {msg.textContent = err.code === 'auth/email-already-in-use' ? 'Ese correo ya tiene una cuenta.' : err.code === 'auth/invalid-credential' ? 'Correo o contraseña incorrectos.' : err.code === 'auth/weak-password' ? 'La contraseña debe tener al menos 6 caracteres.' : err.message} finally {submit.disabled = false} };
    </script>
</body>

</html>
