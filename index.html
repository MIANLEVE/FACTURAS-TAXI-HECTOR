<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>FACTURAS · Acceso privado</title>
    <style>
        :root {
            font-family: Montserrat, "Segoe UI", sans-serif;
            color: #e5eef1;
            background: #0e181d;
            color-scheme: dark
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            background: radial-gradient(ellipse at 50% 0%, #1c3540 0%, #0e181d 68%)
        }

        .card {
            width: min(440px, 100%);
            background: #15232a;
            border: 1px solid #28414b;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 18px 48px #0005
        }

        .brand {
            font-weight: 700;
            letter-spacing: .18em;
            color: #5db5cf;
            font-size: 22px
        }

        .sub {
            color: #93a9b1;
            margin: 4px 0 24px
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin: 14px 0 5px
        }

        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #28414b;
            border-radius: 7px;
            background: #0e181d;
            color: #e5eef1;
            font: inherit
        }

        button {
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            border: 1px solid #5db5cf;
            border-radius: 7px;
            background: #5db5cf;
            color: #06161c;
            font: inherit;
            font-weight: 700;
            cursor: pointer
        }

        .secondary {
            background: #0e181d;
            color: #5db5cf
        }

        input:focus-visible, button:focus-visible {
            outline: 2px solid #5db5cf;
            outline-offset: 2px
        }

        input::placeholder { color: #789099 }
        button:hover { filter: brightness(1.08) }
        button:disabled { opacity: .6; cursor: wait }

        #message {
            min-height: 1.5em;
            color: #f2b8b5;
            font-size: 13px
        }

        small {
            color: #93a9b1
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="brand">FACTURAS</div>
        <p class="sub">Gestión privada de facturas</p>
        <form id="authForm"><label for="email">Correo electrónico</label><input id="email" type="email"
                autocomplete="email" placeholder="Introduce el correo" required><label
                for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password"
                placeholder="Introduce la contraseña" minlength="6" required><button id="submitBtn"
                type="submit">Iniciar sesión</button><button id="forgotBtn" class="secondary" type="button">He olvidado mi contraseña</button><button id="toggleBtn" class="secondary" type="button">Crear una
                cuenta</button>
            <p id="message" role="alert"></p>
        </form><small>¡Hola! Bienvenido, cada cuenta solo puede consultar sus propios datos. Edita tus datos tu logo antes de empezar. Gracias</small>
    </main>
    <script type="module">
        import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
        import {getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
        const config = {apiKey: "AIzaSyAE0jCIQxn6WstfB4laaOWuoDNkWNkJouE", authDomain: "facturas-hector.firebaseapp.com", projectId: "facturas-hector", storageBucket: "facturas-hector.firebasestorage.app", messagingSenderId: "912775387870", appId: "1:912775387870:web:fb7b3c228a84dd6c12004f"};
        const auth = getAuth(initializeApp(config)); const forgot = document.getElementById('forgotBtn'); const form = document.getElementById('authForm'), msg = document.getElementById('message'), submit = document.getElementById('submitBtn'), toggle = document.getElementById('toggleBtn'); let creating = false;
        onAuthStateChanged(auth, u => {if (u) location.replace('generador_facturas_h_taxi.html')});
        forgot.onclick = async () => { const email = document.getElementById('email').value.trim(); if (!email) { msg.textContent = 'Escribe primero tu correo electrónico.'; document.getElementById('email').focus(); return; } msg.style.color = '#1b6b45'; msg.textContent = ''; forgot.disabled = true; try { await sendPasswordResetEmail(auth, email); msg.textContent = 'Si existe una cuenta con ese correo, recibirás un enlace para restablecer la contraseña.'; } catch (err) { msg.style.color = '#a1241c'; msg.textContent = err.code === 'auth/invalid-email' ? 'El correo no tiene un formato válido.' : err.message; } finally { forgot.disabled = false; } };
        toggle.onclick = () => {creating = !creating; forgot.hidden = creating; submit.textContent = creating ? 'Crear cuenta' : 'Iniciar sesión'; toggle.textContent = creating ? 'Ya tengo cuenta' : 'Crear una cuenta'; msg.textContent = ''; document.getElementById('password').autocomplete = creating ? 'new-password' : 'current-password'};
        form.onsubmit = async e => {e.preventDefault(); msg.textContent = ''; submit.disabled = true; try {const email = document.getElementById('email').value.trim(), password = document.getElementById('password').value; if (creating) await createUserWithEmailAndPassword(auth, email, password); else await signInWithEmailAndPassword(auth, email, password); location.replace('generador_facturas_h_taxi.html')} catch (err) {msg.textContent = err.code === 'auth/email-already-in-use' ? 'Ese correo ya tiene una cuenta.' : err.code === 'auth/invalid-credential' ? 'Correo o contraseña incorrectos.' : err.code === 'auth/weak-password' ? 'La contraseña debe tener al menos 6 caracteres.' : err.message} finally {submit.disabled = false} };
    </script>
</body>

</html>
